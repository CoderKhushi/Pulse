<title>Pulse Family App</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<meta name="theme-color" content="#ffffff">
<style>
/* Layout concept: a phone-sized home. White ground, green ink, one bold moment (the kolam ring around the family photo), everything else quiet and rounded. */
:root{
  --g500:#5B964A; --g700:#3B602D; --g600:#4B7A3C; --g400:#7DB06C; --g200:#C9E0BF; --g100:#E3EFDD; --g50:#F3F8F0;
  --ink:#1D2A18; --ink2:#52604C; --ink3:#8A9785; --line:#E4ECDF; --bg:#FFFFFF;
  --gold:#F0AE1B; --gold2:#C98A00; --gold-soft:#FFF3D1; --coral:#E0614A; --coral-soft:#FCE8E3; --sky:#4C8FB5; --sky-soft:#E6F1F7;
  --yellow:#EDB92C; --yellow-soft:#FFF4CF;
  --display:'Baloo 2','Trebuchet MS',system-ui,sans-serif; --body:'Nunito','Segoe UI',system-ui,sans-serif;
  --r-lg:26px; --r-md:18px; --r-sm:12px;
  --shadow:0 6px 24px rgba(59,96,45,.10); --shadow-sm:0 2px 8px rgba(59,96,45,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3,h4,p{margin:0}
svg{display:block}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ico.fill{fill:currentColor;stroke:none}

/* stage */
.stage{min-height:100%;display:flex;justify-content:center;align-items:center;gap:56px;padding:20px}
.side{width:340px;flex:none;display:none}
.phoneWrap{width:100%;display:flex;justify-content:center}
.phone{position:relative;width:100%;max-width:430px;height:100%;min-height:100%;background:#fff;overflow:hidden;display:flex;flex-direction:column}
@media(min-width:760px){
  .stage{padding:24px 20px}
  .phone{width:392px;height:min(820px,calc(100vh - 48px));min-height:640px;min-height:0;border-radius:44px;border:10px solid #1d2a18;box-shadow:0 30px 70px rgba(29,42,24,.28)}
}
@media(min-width:1040px){.side{display:block}.stage{align-items:flex-start}.phoneWrap{position:sticky;top:24px;align-self:flex-start;width:auto}}
@media(max-width:759px){.stage{padding:0;display:block;height:100%}.phoneWrap{height:100%}}

.side h1{font-family:var(--display);font-size:44px;line-height:1;color:var(--g700);font-weight:800;letter-spacing:-.5px}
.side .tag{color:var(--ink2);margin:8px 0 22px;font-size:17px}
.side h3{font-family:var(--display);font-size:15px;color:var(--g700);margin:20px 0 8px;font-weight:700}
.demo-step{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:9px 12px;border-radius:14px;border:1.5px solid var(--line);margin-bottom:7px;font-weight:700;font-size:14px;background:#fff;transition:.15s}
.demo-step:hover{border-color:var(--g500);background:var(--g50)}
.demo-step b{width:24px;height:24px;border-radius:50%;background:var(--g100);color:var(--g700);display:grid;place-items:center;font-size:12px;flex:none}
.demo-row{display:flex;flex-wrap:wrap;gap:6px}
.demo-chip{padding:7px 12px;border-radius:99px;border:1.5px solid var(--line);font-weight:800;font-size:13px}
.demo-chip.on{background:var(--g700);color:#fff;border-color:var(--g700)}
.side .note{font-size:13px;color:var(--ink2);line-height:1.5}
.side .note li{margin-bottom:4px}
.side ul{padding-left:18px;margin:0}

/* views */
.view{display:flex;flex-direction:column;flex:1;min-height:0;position:relative}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 18px 28px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.scroll.has-tab{padding-bottom:100px}
.topbar{display:flex;align-items:center;gap:10px;padding:16px 18px 10px;flex:none}
.topbar .grow{flex:1;min-width:0}
.hello{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.1;color:var(--ink)}
.sub{font-size:13.5px;color:var(--ink2);font-weight:600}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--g50);color:var(--g700);position:relative;flex:none}
.iconbtn .dot{position:absolute;top:8px;right:9px;width:10px;height:10px;border-radius:50%;background:var(--coral);border:2px solid #fff}
.hearts{display:flex;align-items:center;gap:5px;background:var(--gold-soft);color:var(--gold2);border-radius:99px;padding:7px 12px 7px 9px;font-weight:900;font-size:15px;flex:none}
.hearts .ico{width:18px;height:18px;color:var(--coral)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;font-weight:800;font-size:12.5px;background:var(--g100);color:var(--g700)}
.pill.gold{background:var(--gold-soft);color:var(--gold2)}
.pill.coral{background:var(--coral-soft);color:var(--coral)}
.pill.sky{background:var(--sky-soft);color:var(--sky)}
.pill.line{background:#fff;border:1.5px solid var(--line);color:var(--ink2)}
.pill .ico{width:14px;height:14px}

/* tab bar */
.tabbar{position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:1.5px solid var(--line);display:flex;justify-content:space-around;padding:8px 8px calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:62px;padding:6px 8px;border-radius:16px;color:var(--ink3);font-weight:800;font-size:11.5px;position:relative}
.tab .ico{width:25px;height:25px}
.tab.on{color:var(--g700)}
.tab.on .ico{stroke-width:2.4}
.tab.on::before{content:"";position:absolute;top:-9px;width:26px;height:4px;border-radius:0 0 4px 4px;background:var(--g500)}
.tab.center .bub{width:50px;height:50px;border-radius:50%;background:linear-gradient(145deg,var(--g500),var(--g700));color:#fff;display:grid;place-items:center;margin-top:-26px;box-shadow:0 6px 16px rgba(59,96,45,.35);border:4px solid #fff}
.tab.center.on::before{display:none}
.tab.center{color:var(--g700)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:99px;font-weight:900;font-size:16px;background:var(--g500);color:#fff;box-shadow:0 4px 0 var(--g700);transition:transform .08s,box-shadow .08s;text-align:center}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--g700)}
.btn.block{width:100%}
.btn.soft{background:var(--g100);color:var(--g700);box-shadow:0 4px 0 var(--g200)}
.btn.ghost{background:#fff;color:var(--g700);border:2px solid var(--g200);box-shadow:none;min-height:46px}
.btn.gold{background:var(--gold);color:#4a3200;box-shadow:0 4px 0 var(--gold2)}
.btn.coral{background:var(--coral);box-shadow:0 4px 0 #b34532}
.btn.sm{min-height:40px;padding:0 16px;font-size:14px;box-shadow:0 3px 0 var(--g700)}
.btn.sm.soft{box-shadow:0 3px 0 var(--g200)}
.btn[disabled]{opacity:.45;pointer-events:none}
.link{color:var(--g700);font-weight:800;text-decoration:underline;text-underline-offset:3px;font-size:14px}

/* cards */
.card{background:#fff;border:1.5px solid var(--line);border-radius:var(--r-lg);padding:16px;position:relative}
.card.tint{background:var(--g50);border-color:var(--g100)}
.card.gold{background:var(--gold-soft);border-color:#F6DE9B}
.card.shadow{box-shadow:var(--shadow);border-color:transparent}
.card.dark{background:linear-gradient(150deg,var(--g600),var(--g700));color:#fff;border:0}
.stack{display:flex;flex-direction:column;gap:14px}
.stack.s8{gap:8px}.stack.s10{gap:10px}.stack.s20{gap:20px}
.row{display:flex;align-items:center;gap:12px}
.row.top{align-items:flex-start}
.row.between{justify-content:space-between}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.h2{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.15;color:var(--ink)}
.h3{font-family:var(--display);font-weight:700;font-size:17px;line-height:1.2}
.h1{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.05;color:var(--g700)}
.muted{color:var(--ink2);font-size:14px}
.tiny{font-size:12.5px;color:var(--ink3);font-weight:700}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:6px 2px -4px}
.sec .h2{font-size:18px}
.center{text-align:center}
.divider{height:1.5px;background:var(--line);margin:4px 0}

/* progress */
.bar{height:12px;border-radius:99px;background:var(--g100);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--g400),var(--g500));transition:width .8s cubic-bezier(.2,.8,.2,1)}
.bar.gold{background:#FBE7B0}.bar.gold>i{background:linear-gradient(90deg,#F7C84A,var(--gold))}
.bar.thin{height:8px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 15px;border-radius:99px;border:2px solid var(--line);font-weight:800;font-size:14.5px;background:#fff;color:var(--ink2);transition:.12s;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--g100);border-color:var(--g500);color:var(--g700)}
.chip:active{transform:scale(.96)}

/* kolam hero */
.kolam{position:relative;width:min(100%,330px);aspect-ratio:1;margin:0 auto}
.kolam svg{width:100%;height:100%;overflow:visible}
.petal{cursor:pointer;transition:transform .3s}
.petal .shape{fill:#fff;stroke:var(--g200);stroke-width:2.5;stroke-dasharray:5 5;transition:.5s}
.petal.done .shape{fill:url(#pg);stroke:var(--g500);stroke-dasharray:none}
.petal.next .shape{stroke:var(--gold);stroke-width:3.5;animation:pulseStroke 1.6s infinite}
.petal:hover{transform:scale(1.04)}
.petal .pico{color:var(--g400)}
.petal.done .pico{color:#fff}
.petal.next .pico{color:var(--gold2)}
@keyframes pulseStroke{50%{stroke-width:6;stroke:#F7CE6A}}
.photo-tap{cursor:pointer}
.kolam .centerHint{position:absolute;left:0;right:0;bottom:2%;text-align:center}
.bloom{animation:bloom .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes bloom{from{transform:scale(.6);opacity:.2}to{transform:scale(1);opacity:1}}
.glow{filter:drop-shadow(0 0 10px rgba(240,174,27,.65))}

/* quest rows */
.quest{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-md);border:1.5px solid var(--line);background:#fff;width:100%;text-align:left}
.quest .qi{width:42px;height:42px;border-radius:14px;background:var(--g50);color:var(--g600);display:grid;place-items:center;flex:none}
.quest.done{background:var(--g50);border-color:var(--g100)}
.quest.done .qi{background:var(--g500);color:#fff}
.quest.next{border-color:var(--gold);background:#FFFBEE}
.quest.next .qi{background:var(--gold);color:#4a3200}
.quest b{display:block;font-size:15.5px}
.quest small{color:var(--ink2);font-weight:600;font-size:13px}
.reward{margin-left:auto;font-weight:900;font-size:13px;color:var(--gold2);display:flex;align-items:center;gap:3px;flex:none}
.reward .ico{width:15px;height:15px;color:var(--coral)}

/* week strip */
.week{display:flex;justify-content:space-between}
.week .d{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;font-weight:800;color:var(--ink3)}
.week svg{width:36px;height:36px}

/* overlays and sheets */
.overlay{position:absolute;inset:0;background:#fff;z-index:20;display:flex;flex-direction:column}
.overlay.in{animation:slideIn .28s cubic-bezier(.2,.8,.2,1)}
@keyframes slideIn{from{transform:translateX(30%);opacity:0}to{transform:none;opacity:1}}
.shade{position:absolute;inset:0;background:rgba(29,42,24,.45);z-index:30;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;background:#fff;border-radius:30px 30px 0 0;z-index:31;display:flex;flex-direction:column;animation:up .32s cubic-bezier(.2,.9,.2,1)}
@keyframes up{from{transform:translateY(100%)}}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:10px auto 2px;flex:none}
.sheet .sbody{overflow-y:auto;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));scrollbar-width:none}
.ovhead{display:flex;align-items:center;gap:10px;padding:14px 16px 8px;flex:none}
.ovhead .t{font-family:var(--display);font-weight:700;font-size:21px;flex:1;min-width:0;line-height:1.1}
.ovfoot{padding:12px 18px calc(14px + env(safe-area-inset-bottom,0px));border-top:1.5px solid var(--line);flex:none;background:#fff}

/* toast, push, fx */
.toast{position:absolute;left:50%;bottom:104px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:99px;font-weight:800;font-size:14px;z-index:60;display:flex;align-items:center;gap:8px;animation:toast 2.6s forwards;max-width:90%;text-align:center;box-shadow:var(--shadow)}
@keyframes toast{0%{opacity:0;transform:translate(-50%,16px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.push{position:absolute;top:10px;left:10px;right:10px;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border-radius:22px;padding:12px 14px;z-index:70;box-shadow:0 12px 36px rgba(29,42,24,.28);border:1.5px solid var(--line);animation:drop .5s cubic-bezier(.2,1.2,.3,1);cursor:pointer}
@keyframes drop{from{transform:translateY(-140%)}}
.push .pt{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:var(--ink3);margin-bottom:5px}
.push .pt i{width:20px;height:20px;border-radius:6px;background:var(--g500);display:grid;place-items:center;color:#fff}
.push .pt i .ico{width:13px;height:13px}
.push b{display:block;font-size:15px}
.push p{font-size:14px;color:var(--ink2)}
.push .pa{display:flex;gap:8px;margin-top:8px}
.push .pa button{flex:1;padding:8px;border-radius:12px;background:var(--g100);color:var(--g700);font-weight:900;font-size:14px}
#fx{position:absolute;inset:0;pointer-events:none;z-index:80;overflow:hidden}
.conf{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall 2.4s ease-in forwards}
@keyframes fall{to{transform:translateY(900px) rotate(720deg);opacity:.9}}
.floatheart{position:absolute;bottom:20%;font-size:28px;animation:floaty 1.8s ease-out forwards}
@keyframes floaty{to{transform:translateY(-300px) scale(1.4);opacity:0}}

/* voice player */
.voicebox{position:absolute;inset:0;z-index:50;background:rgba(29,42,24,.55);display:grid;place-items:center;padding:24px;animation:fade .2s}
.voicecard{background:#fff;border-radius:32px;padding:26px 22px 22px;width:100%;text-align:center;animation:pop .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.wave{display:flex;align-items:center;justify-content:center;gap:4px;height:44px;margin:12px 0}
.wave i{width:5px;border-radius:5px;background:var(--g500);height:10px;animation:wv 0.9s ease-in-out infinite}
.wave i:nth-child(3n){animation-delay:.15s;background:var(--g400)}.wave i:nth-child(3n+1){animation-delay:.3s}
@keyframes wv{50%{height:40px}}
.wave.off i{animation:none;height:6px;background:var(--g200)}
.wave.rec i{background:var(--coral)}

/* inputs */
.field{width:100%;border:2px solid var(--line);border-radius:16px;padding:13px 16px;font:inherit;font-size:17px;font-weight:700;color:var(--ink);background:#fff}
.field:focus{border-color:var(--g500);outline:none}
.lbl{font-weight:800;font-size:13.5px;color:var(--ink2);margin-bottom:6px;display:block}
.toggle{width:52px;height:30px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:.2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.2s}
.toggle.on{background:var(--g500)}.toggle.on::after{left:25px}
.toggle.locked{background:var(--g200);opacity:.8}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1.5px solid var(--line)}
.item:last-child{border:0}
.av{display:block;border-radius:50%;overflow:hidden;flex:none;background:var(--g100)}
.calm .ico,.warn .ico{display:inline-block;vertical-align:-5px;margin-right:6px}

/* dish */
.dish{border:2px solid var(--line);border-radius:20px;padding:12px 8px 10px;text-align:center;background:#fff;position:relative;overflow:hidden;width:100%}
.dish .em{font-size:34px;line-height:1.1}
.dish b{display:block;font-size:14px;margin-top:2px}
.dish small{font-weight:800;font-size:12px;color:var(--ink2)}
.dish.g{border-color:var(--g200);background:var(--g50)}
.dish.y{border-color:#F4DB8A;background:#FFFAE6}
.dish.r{border-color:#F3B9AD;background:#FFF3F0}
.dish.u{border-style:dashed;background:#fff}
.dish.u .em{filter:grayscale(1) opacity(.4)}
.dish .cdot{position:absolute;top:8px;right:8px;width:12px;height:12px;border-radius:50%}
.dish.g .cdot{background:var(--g500)}.dish.y .cdot{background:var(--yellow)}.dish.r .cdot{background:var(--coral)}
.dish.sel{border-color:var(--g500);background:var(--g100)}
.dish .cnt{position:absolute;top:6px;left:6px;background:var(--g700);color:#fff;border-radius:99px;min-width:24px;height:24px;display:grid;place-items:center;font-size:13px;font-weight:900;padding:0 6px}
.cbadge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px 3px 8px;border-radius:99px;font-weight:900;font-size:12.5px}
.cbadge::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor}
.cbadge.g{background:var(--g100);color:var(--g700)}.cbadge.y{background:var(--yellow-soft);color:#9a7000}.cbadge.r{background:var(--coral-soft);color:var(--coral)}.cbadge.u{background:#eee;color:#777}
.flip{animation:flip .8s cubic-bezier(.3,1.3,.5,1)}
@keyframes flip{from{transform:rotateY(90deg) scale(.8)}}

/* mic */
.micwrap{position:relative;width:170px;height:170px;margin:0 auto;display:grid;place-items:center;touch-action:none;user-select:none}
.mic{width:120px;height:120px;border-radius:50%;background:linear-gradient(150deg,var(--g500),var(--g700));color:#fff;display:grid;place-items:center;box-shadow:0 8px 0 #2b4621,0 14px 30px rgba(59,96,45,.35);position:relative;z-index:2;transition:transform .1s}
.mic .ico{width:50px;height:50px}
.micwrap.live .mic{transform:scale(1.08);background:linear-gradient(150deg,var(--coral),#b34532);box-shadow:0 8px 0 #8d2f1f}
.micwrap .ring{position:absolute;inset:10px;border-radius:50%;border:3px solid var(--g400);opacity:0}
.micwrap.live .ring{animation:ripple 1.3s infinite}
.micwrap.live .ring:nth-child(2){animation-delay:.45s}
@keyframes ripple{from{transform:scale(.8);opacity:.9}to{transform:scale(1.5);opacity:0}}

/* misc */
.stat{background:var(--g50);border-radius:18px;padding:12px;text-align:center}
.stat b{font-family:var(--display);font-size:24px;display:block;line-height:1.1;color:var(--g700)}
.stat small{font-size:12px;font-weight:800;color:var(--ink2)}
.seg{display:flex;background:var(--g50);border-radius:99px;padding:4px;gap:2px}
.seg button{flex:1;padding:9px 6px;border-radius:99px;font-weight:900;font-size:14px;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--g700);box-shadow:var(--shadow-sm)}
.node{display:flex;gap:14px;align-items:stretch}
.node .rail{display:flex;flex-direction:column;align-items:center;width:46px;flex:none}
.node .rail .bubble{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#fff;border:3px solid var(--g200);color:var(--ink3);flex:none}
.node .rail .line{flex:1;width:4px;background:repeating-linear-gradient(var(--g200) 0 6px,transparent 6px 12px);margin:2px 0}
.node.done .bubble{background:var(--g500);border-color:var(--g500);color:#fff}
.node.done .line{background:var(--g500)}
.node.now .bubble{border-color:var(--gold);background:var(--gold-soft);color:var(--gold2);animation:pulseRing 1.8s infinite}
@keyframes pulseRing{50%{box-shadow:0 0 0 9px rgba(240,174,27,.2)}}
.node .nb{flex:1;padding-bottom:16px;min-width:0}
.node .nb button{width:100%;text-align:left}
.node.locked .nb .card{opacity:.7}
.scratch{position:relative;border-radius:22px;overflow:hidden;width:100%;aspect-ratio:1.5;background:var(--gold-soft);border:2px solid #F6DE9B;touch-action:none}
.scratch canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab}
.scratch .under{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:14px}
.bubbleMsg{padding:12px 14px;border-radius:18px;background:var(--g50);max-width:88%}
.bubbleMsg.me{background:var(--g500);color:#fff;margin-left:auto}
.stamp{width:100%;aspect-ratio:1;border-radius:50%;border:2.5px dashed var(--g200);display:grid;place-items:center;color:var(--g200);font-weight:900}
.stamp.on{border:0;background:var(--g500);color:#fff;transform:rotate(-8deg)}
.welcome-door{border:2px solid var(--line);border-radius:24px;padding:16px;display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:#fff;transition:.15s}
.welcome-door:hover{border-color:var(--g500);background:var(--g50)}
.house{width:100%;max-width:150px;margin:0 auto}
.warn{background:var(--yellow-soft);border:1.5px solid #F4DB8A;border-radius:18px;padding:12px 14px;font-weight:700;font-size:14px}
.calm{background:var(--sky-soft);border:1.5px solid #C5DCEA;border-radius:18px;padding:12px 14px;font-weight:700;font-size:14px;color:#2d5d7a}
.big3{display:flex;flex-direction:column;gap:14px}
.big3 .bigbtn{display:flex;align-items:center;gap:16px;padding:20px 20px;border-radius:28px;background:var(--g50);border:2.5px solid var(--g200);font-family:var(--display);font-weight:700;font-size:28px;text-align:left;width:100%}
.big3 .bigbtn .bi{width:64px;height:64px;border-radius:20px;background:var(--g500);color:#fff;display:grid;place-items:center;flex:none}
.big3 .bigbtn .bi .ico{width:34px;height:34px}
.big3 .bigbtn small{display:block;font-family:var(--body);font-size:15px;font-weight:700;color:var(--ink2)}
.big3 .bigbtn.done{background:var(--g100);border-color:var(--g500)}
.easy .hello{font-size:25px}
.easy .btn{min-height:60px;font-size:20px}
.num{font-variant-numeric:tabular-nums}
.big-num{font-family:var(--display);font-weight:800;font-size:72px;line-height:1;color:var(--g700);font-variant-numeric:tabular-nums}
.stepper{display:flex;align-items:center;justify-content:center;gap:18px}
.stepper button{width:56px;height:56px;border-radius:50%;background:var(--g100);color:var(--g700);display:grid;place-items:center;font-size:30px;font-weight:900}
.stepper.sm button{width:38px;height:38px;font-size:22px}
.tip{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--ink2);font-weight:600}
.ticks{display:flex;gap:6px}
.ticks i{height:6px;flex:1;border-radius:9px;background:var(--g100)}
.ticks i.on{background:var(--g500)}
input[type=range]{width:100%;accent-color:var(--g500);height:34px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.paper{background:#FFFDF6;border:1.5px solid #EFE6C8;border-radius:10px;padding:18px;box-shadow:var(--shadow-sm);transform:rotate(-1deg)}
.hand{font-family:var(--display);font-weight:600}

/* ---------- Kolam ring ---------- */
const QUESTS=[
 {id:'am',ic:'pill',t:'Morning tablet',s:'After your coffee',hr:10,act:'meds'},
 {id:'bf',ic:'plate',t:'Log breakfast',s:'Say it, snap it or tap it',hr:15,act:'log',arg:'bf'},
 {id:'ln',ic:'plate',t:'Log lunch',s:'One tap if it is the usual',hr:15,act:'log',arg:'ln'},
 {id:'wk',ic:'walk',t:'Walk after dinner',s:'10 minutes with Lakshmi amma',hr:20,act:'walk'},
 {id:'pm',ic:'moon',t:'Night tablet',s:'After dinner',hr:10,act:'meds'},
];
function kolamSVG(quests,opts={}){
  const cx=165,cy=165,R=128,pr=32;let s='';const next=QUESTS.find(q=>!quests[q.id]);const allDone=!next;
  s+=`<defs><linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7DB06C"/><stop offset="1" stop-color="#4B7A3C"/></linearGradient><clipPath id="pc"><circle cx="${cx}" cy="${cy}" r="92"/></clipPath></defs>`;
  // pulli ring + loops
  for(let i=0;i<20;i++){const a=i*18*Math.PI/180;s+=`<circle cx="${cx+Math.cos(a)*103}" cy="${cy+Math.sin(a)*103}" r="2.2" fill="${allDone?'#F0AE1B':'#C9E0BF'}"/>`}
  for(let i=0;i<5;i++){
    const a1=(-90+i*72)*Math.PI/180,a2=(-90+(i+1)*72)*Math.PI/180,am=(a1+a2)/2;
    const p1=[cx+Math.cos(a1)*(R+pr-6),cy+Math.sin(a1)*(R+pr-6)],p2=[cx+Math.cos(a2)*(R+pr-6),cy+Math.sin(a2)*(R+pr-6)],c=[cx+Math.cos(am)*(R+34),cy+Math.sin(am)*(R+34)];
    s+=`<path d="M${p1[0]} ${p1[1]}Q${c[0]} ${c[1]} ${p2[0]} ${p2[1]}" fill="none" stroke="${allDone?'#F0AE1B':'#C9E0BF'}" stroke-width="2.2" stroke-linecap="round"/>`;
    s+=`<circle cx="${cx+Math.cos(am)*(R+14)}" cy="${cy+Math.sin(am)*(R+14)}" r="4.5" fill="${allDone?'#F0AE1B':'#5B964A'}"/>`;
  }
  QUESTS.forEach((q,i)=>{
    const ang=-90+i*72,rad=ang*Math.PI/180,px=cx+Math.cos(rad)*R,py=cy+Math.sin(rad)*R,done=quests[q.id],isNext=next&&next.id===q.id;
    s+=`<g class="petal ${done?'done':''} ${isNext&&!opts.ro?'next':''} ${opts.bloom===q.id?'bloom':''}" ${opts.ro?'':`data-act="petal" data-arg="${q.id}" tabindex="0" role="button"`} aria-label="${q.t}${done?', done':''}" style="transform-origin:${px}px ${py}px;${opts.ro?'cursor:default':''}">
      <ellipse class="shape" cx="${px}" cy="${py}" rx="${pr-3}" ry="${pr+9}" transform="rotate(${ang+90} ${px} ${py})"/>
      <g class="pico" style="color:inherit">${icoG(done?'check':q.ic,px,py,26)}</g></g>`;
  });
  s+=`<circle cx="${cx}" cy="${cy}" r="96" fill="#fff"/><g clip-path="url(#pc)" class="photo-tap" ${opts.ro?'':'data-act="photoTap"'}><g transform="translate(0,0)">${familyPhoto(S.photoV)}</g></g><circle cx="${cx}" cy="${cy}" r="92" fill="none" stroke="${allDone?'#F0AE1B':'#fff'}" stroke-width="${allDone?5:3}"/>`;
  return `<svg viewBox="-12 -12 354 354" role="img" aria-label="Today's kolam: ${Object.values(quests).filter(Boolean).length} of 5 petals bloomed" class="${allDone?'glow':''}">${s}</svg>`;
}
function flower(n,state='part',size=36){
  let s='';for(let i=0;i<5;i++){const a=-90+i*72,on=i<n&&state!=='rest';s+=`<ellipse cx="18" cy="9" rx="4.6" ry="7.6" transform="rotate(${a+90} 18 18) translate(0,0)" transform-origin="18 18" style="transform:rotate(${i*72}deg);transform-origin:18px 18px" fill="${on?'#5B964A':state==='future'?'#fff':'#fff'}" stroke="${on?'#3B602D':'#C9E0BF'}" stroke-width="1.5" ${on?'':'stroke-dasharray="2 2"'}/>`}
  s+=`<circle cx="18" cy="18" r="3.2" fill="${n>=5?'#F0AE1B':state==='rest'?'#C9E0BF':'#E3EFDD'}"/>`;
  return `<svg viewBox="0 0 36 36" width="${size}" height="${size}">${s}</svg>`;
}

const LEVELS=[

function levelOf(h){let l=0;LEVELS.forEach((x,i)=>{if(h>=x.min)l=i});return l}
function banyan(l=2,size=150){
  const g=['#7DB06C','#5B964A','#4B7A3C','#3B602D'];let s=`<ellipse cx="100" cy="176" rx="${50+l*12}" ry="8" fill="#E3EFDD"/>`;
  if(l===0){s+=`<path d="M100 176V150" stroke="#5B964A" stroke-width="5" stroke-linecap="round"/><path d="M100 152C86 150 80 138 82 130 94 130 100 140 100 152z" fill="#7DB06C"/><path d="M100 150C114 146 120 134 118 126 106 128 100 138 100 150z" fill="#5B964A"/>`}
  else{
    const trunkW=[0,7,10,14,18][l];
    s+=`<path d="M${100-trunkW} 176C${100-trunkW/2} 150 ${100-trunkW/2} 130 ${100-trunkW/2} 112L${100+trunkW/2} 112C${100+trunkW/2} 130 ${100+trunkW/2} 150 ${100+trunkW} 176z" fill="#9A7B55"/>`;
    if(l>=4){[-46,-30,30,46].forEach(x=>{s+=`<path d="M${100+x} 108C${100+x} 140 ${100+x*1.05} 160 ${100+x*1.1} 176" stroke="#9A7B55" stroke-width="4" fill="none" stroke-linecap="round"/>`})}
    const C=[[],[[100,100,22],[84,112,16],[116,112,16]],[[100,86,26],[78,104,20],[122,104,20],[88,118,16],[112,118,16]],[[100,76,28],[72,96,24],[128,96,24],[84,118,20],[116,118,20],[100,102,24]],[[100,66,30],[66,84,28],[134,84,28],[44,106,22],[156,106,22],[82,106,26],[118,106,26],[100,92,26]]][l];
    C.forEach((c,i)=>{s+=`<circle cx="${c[0]}" cy="${c[1]}" r="${c[2]}" fill="${g[i%4]}"/>`});
    if(l>=3)[[88,80],[118,92],[70,100],[132,104]].forEach(p=>{s+=`<circle cx="${p[0]}" cy="${p[1]}" r="3.4" fill="#F0AE1B"/>`});
  }
  return `<svg viewBox="0 0 200 190" width="${size}" height="${size*.95}" aria-hidden="true">${s}</svg>`;
}

let AC=null;
function chime(kind='ok'){
  if(!S.sound)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const seq={ok:[523,659,784],win:[523,659,784,1047,1319],pop:[660],soft:[440,554]}[kind]||[660];
    seq.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;const t=AC.currentTime+i*.09;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.12,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.5);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+.55)});
  }catch(e){}
}
function confetti(n=42){
  const fx=document.getElementById('fx');if(!fx)return;const cols=['#5B964A','#F0AE1B','#E0614A','#7DB06C','#4C8FB5','#fff'];
  for(let i=0;i<n;i++){const e=document.createElement('i');e.className='conf';e.style.left=Math.random()*100+'%';e.style.background=cols[i%cols.length];e.style.animationDelay=Math.random()*.5+'s';e.style.transform=`rotate(${Math.random()*360}deg)`;e.style.width=6+Math.random()*8+'px';fx.appendChild(e);setTimeout(()=>e.remove(),3200)}
}
function hearts(n=6){
  const fx=document.getElementById('fx');if(!fx)return;
  for(let i=0;i<n;i++){const e=document.createElement('span');e.className='floatheart';e.textContent=['💚','❤️','🧡','💛'][i%4];e.style.left=15+Math.random()*70+'%';e.style.animationDelay=i*.12+'s';fx.appendChild(e);setTimeout(()=>e.remove(),2400)}
}

function render(){

  const scr=$('#screen'),ov=$('#overlay'),sh=$('#sheet'),vh=$('#voice');

/* ----- Sugar Detective ----- */
SCREENS.detective=()=>{
  const D=S.detective,d=dish(D.dish);
  const ticks=`<div class="ticks">${[0,1,2,3,4,5].map(i=>`<i class="${i<=D.step?'on':''}"></i>`).join('')}</div>`;
  let body='';
  if(D.step===0){const unk=DISHES.filter(x=>!x.s);body=`<div class="h2">Pick a mystery dish</div><p class="muted">Choose something you'll eat today. Only one check before and one after.</p><div class="grid3">${unk.map(x=>`<button class="dish u ${D.dish===x.id?'sel':''}" ${A('detDish',x.id)}><div class="em" style="filter:none">${x.e}</div><b>${x.n}</b></button>`).join('')}</div><button class="btn block" ${A('detNext')}>Start the mission</button>`}
  if(D.step===1)body=`<div class="center stack"><div style="font-size:54px">${d.e}</div><div class="h2">Check before your first bite</div><p class="muted">Prick, read the meter, enter the number.</p><div class="big-num">${D.before}</div><div class="tiny">mg/dL before ${d.n}</div>
   <div class="stepper"><button ${A('detB','-5')} aria-label="Lower by 5">−</button><button ${A('detB','5')} aria-label="Raise by 5">+</button></div>
   <button class="btn soft block" ${A('detSnapMeter')}>${ico('camera')} Snap the meter instead</button><button class="btn block" ${A('detNext')}>Lock it in</button></div>`;
  if(D.step===2)body=`<div class="center stack"><div class="h2">Your guess first</div><p class="muted">How much will ${d.n} lift your sugar in 2 hours?</p><div style="font-size:64px">${D.guess<25?'😌':D.guess<55?'🙂':D.guess<75?'😬':'😱'}</div><div class="big-num" style="color:var(--gold2)">+${D.guess}</div>
   <input type="range" min="0" max="100" value="${D.guess}" data-bind="detective.guess" data-live="1" aria-label="Your guess"><div class="row between tiny"><span>Barely</span><span>A lot</span></div><button class="btn gold block" ${A('detNext')}>Lock my guess</button></div>`;
  if(D.step===3)body=`<div class="center stack"><div style="font-size:54px">${d.e}</div><div class="h2">Enjoy your ${d.n.toLowerCase()}</div><p class="muted">Pulse will nudge you 2 hours after your last bite.</p>
   <div style="position:relative;width:170px;height:170px;margin:0 auto"><svg viewBox="0 0 170 170"><circle cx="85" cy="85" r="72" fill="none" stroke="#E3EFDD" stroke-width="12"/><circle cx="85" cy="85" r="72" fill="none" stroke="#5B964A" stroke-width="12" stroke-linecap="round" stroke-dasharray="452" stroke-dashoffset="${D.waiting?0:380}" transform="rotate(-90 85 85)" style="transition:stroke-dashoffset 1.2s"/></svg><div style="position:absolute;inset:0;display:grid;place-items:center"><div class="big-num" style="font-size:36px">${D.waiting?'2:00':'1:58'}</div></div></div>
   <button class="btn block" ${A('detSkip')}>${ico('clock')} Skip 2 hours (demo)</button></div>`;
  if(D.step===4)body=`<div class="center stack"><div style="font-size:54px">⏱</div><div class="h2">Two hours later</div><p class="muted">One more prick. Enter the number.</p><div class="big-num">${D.after}</div><div class="tiny">mg/dL after ${d.n}</div>
   <div class="stepper"><button ${A('detA','-5')} aria-label="Lower by 5">−</button><button ${A('detA','5')} aria-label="Raise by 5">+</button></div><button class="btn gold block" ${A('detReveal')}>Reveal the result</button></div>`;
  if(D.step===5){const r=D.after-D.before,c=r<=35?'g':r<=60?'y':'r',off=Math.abs(r-D.guess);
   body=`<div class="center stack"><div class="dish ${c} flip" style="width:200px;margin:0 auto;padding:22px 10px"><span class="cdot"></span><div class="em" style="font-size:64px">${d.e}</div><b style="font-size:18px">${d.n}</b><div class="h1" style="color:inherit;margin-top:6px">+${r}</div>${cbadge(c)}</div>
   <div class="card tint">You guessed <b>+${D.guess}</b>. Real answer <b>+${r}</b>. ${off<=8?'Spot on. You know your body.':r<D.guess?'Your body is kinder than you thought.':'Sneaky. This one climbs more than it looks.'}</div>
   <div class="pill gold" style="align-self:center">+25 hearts · Dish Dex ${decoded()} of 24</div>
   <div class="grid2"><button class="btn soft" ${A('detAgain')}>Decode another</button><button class="btn" ${A('detDone')}>See Dish Dex</button></div></div>`}
  return `${head('Sugar Detective')}<div class="scroll"><div class="stack s20">${ticks}${body}</div></div>`;
};
ACT.detDish=(id)=>{S.detective.dish=id;render()};
ACT.detNext=()=>{const D=S.detective;D.step++;if(D.step===4){D.after=D.before+(TRUTH[D.dish]||40)}chime('pop');render()};
ACT.detB=(v)=>{S.detective.before=Math.max(60,S.detective.before+ +v);render()};
ACT.detA=(v)=>{S.detective.after=Math.max(60,S.detective.after+ +v);render()};
ACT.detSnapMeter=()=>{S.detective.before=96+Math.floor(Math.random()*30);toast('Meter read automatically','camera');render()};
ACT.detSkip=()=>{S.detective.waiting=true;render();setTimeout(()=>{ACT.detNext()},900)};
ACT.detReveal=()=>{const D=S.detective,d=dish(D.dish),r=D.after-D.before;d.s=r<=35?'g':r<=60?'y':'r';d.r=r;d.tip=d.tip||'Decoded by you, on '+new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short'})+'.';S.dexNew=d.id;D.step=5;D.waiting=false;chime('win');confetti(34);render();earn(25,'Two-Prick Check')};

document.addEventListener('rendered',()=>{
  const cv=$('#sc');if(!cv||cv._init)return;cv._init=1;const b=$('#scratchbox').getBoundingClientRect(),dpr=window.devicePixelRatio||1;cv.width=b.width*dpr;cv.height=b.height*dpr;
  const c=cv.getContext('2d',{willReadFrequently:true});c.scale(dpr,dpr);const g=c.createLinearGradient(0,0,b.width,b.height);g.addColorStop(0,'#7DB06C');g.addColorStop(.5,'#A8CF9A');g.addColorStop(1,'#4B7A3C');c.fillStyle=g;c.fillRect(0,0,b.width,b.height);
  c.fillStyle='rgba(255,255,255,.25)';for(let x=0;x<b.width;x+=22)for(let y=0;y<b.height;y+=22){c.beginPath();c.arc(x+(y/22%2)*11,y,2.5,0,7);c.fill()}
  c.fillStyle='#fff';c.font='800 24px "Baloo 2", sans-serif';c.textAlign='center';c.fillText('Scratch here',b.width/2,b.height/2+6);
  let down=false,n=0;const sc=(e)=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left),(e.clientY-r.top)]};
  const dot=(e)=>{const [x,y]=sc(e);c.globalCompositeOperation='destination-out';c.beginPath();c.arc(x,y,24,0,7);c.fill();if(++n%5===0)check()};
  const check=()=>{const d=c.getImageData(0,0,cv.width,cv.height).data;let t=0,k=0;for(let i=3;i<d.length;i+=4*40){k++;if(d[i]<20)t++}if(t/k>.45)finish()};
  const finish=()=>{if(S.scratchDone)return;S.scratchDone=true;const r=REWARDS[S.giftLog.length%REWARDS.length];if(r.save){S.saved+=r.save}confetti(46);chime('win');hearts(5);earn(10,'Gift opened');render()};
  cv.addEventListener('pointerdown',e=>{down=true;cv.setPointerCapture(e.pointerId);dot(e)});cv.addEventListener('pointermove',e=>{if(down)dot(e)});cv.addEventListener('pointerup',()=>{down=false;check()});
});

function nudgeAct(n){
  const a=n.act;
  if(a==='meds'){S.stack=[{name:'meds'}]}

  else if(a==='walk'){S.stack=[{name:'walk'}]}
  else if(a==='chat'){S.stack=[{name:'chat'}]}
}

   <div class="row" style="margin-top:12px;justify-content:space-around;text-align:center">${[['Bronze',25],['Silver',60],['Gold',120]].map(([n,v])=>`<div style="opacity:${m>=v?1:.4}"><div style="font-size:30px">${['🥉','🥈','🥇'][['Bronze','Silver','Gold'].indexOf(n)]}</div><div class="tiny">${n} · ${v}</div></div>`).join('')}</div></div>
  <div class="grid2"><div class="stat"><b>12</b><small>Elders served without the app</small></div><div class="stat"><b>96%</b><small>Refills collected on time</small></div></div>`;
}

/* ---------- Demo director ---------- */
const S0=JSON.stringify(S),D0=JSON.stringify(DISHES);
function resetState(){const f=JSON.parse(S0);Object.keys(S).forEach(k=>delete S[k]);Object.assign(S,f);JSON.parse(D0).forEach((o,i)=>{const d=DISHES[i];Object.keys(d).forEach(k=>delete d[k]);Object.assign(d,o)});}
const DEMO=[
 ['Divya sets up Appa\'s home',()=>{S.role='helper';S.htab='today';S.setup.step=0;S.setupDone=false;S.stack=[{name:'setup'}]}],
 ['Appa takes a tablet, hears Divya',()=>{S.role='patient';S.mode='standard';S.tab='home';S.quests.am=false;S.doses.am=null;S.stack=[{name:'meds'}]}],
 ['He logs lunch by voice',()=>{S.role='patient';S.mode='standard';S.tab='plate';S.plateTab='log';S.slot='ln';S.stack=[]}],
 ['Dish colours, My Plate, Kitchen Card',()=>{S.role='patient';S.tab='plate';S.plateTab='plan';S.stack=[]}],
 ['A 62 mg/dL reading fires the Safety Net',()=>{S.role='patient';S.stack=[{name:'safety'}];S.safe={}}],
 ['Chemist logs a BP of 156/96',()=>{S.role='chemist';S.ctab='check';S.counter.bpS=156;S.counter.bpD=96;S.counter.sug=124;S.counter.sent=false}],
 ['Care team prompt reaches Appa',()=>{S.role='patient';S.tab='care';S.carePrompt='open';S.notNow=0;S.stack=[]}],
 ['Day 90: Report Card and Savings Meter',()=>{S.role='patient';S.day=90;S.saved=2638;S.hearts=Math.max(S.hearts,1580);S.tab='journey';S.stack=[{name:'report'}];setTimeout(()=>{confetti(60);chime('win')},500)}],
];
function demoContent(){
  return `<div class="stack s8">${DEMO.map((d,i)=>`<button class="demo-step" ${A('demo',i)}><b>${i+1}</b><span>${d[0]}</span></button>`).join('')}</div>
  <h3>Look</h3><div class="demo-row">${[['easy','Easy Mode'],['standard','Standard'],['busy','Busy Mode']].map(([k,l])=>`<button class="demo-chip ${S.mode===k&&S.role==='patient'?'on':''}" ${A('demoMode',k)}>${l}</button>`).join('')}</div>
  <h3>Jump in the 90 days</h3><div class="demo-row">${[[1,'Day 1'],[23,'Day 23'],[60,'Day 60'],[90,'Day 90']].map(([d,l])=>`<button class="demo-chip ${S.day===d?'on':''}" ${A('demoDay',d)}>${l}</button>`).join('')}</div>
  <h3>Other</h3><div class="demo-row"><button class="demo-chip" ${A('demoPush')}>Fire a nudge</button><button class="demo-chip" ${A('demoComplete')}>Bloom all petals</button><button class="demo-chip" ${A('demoReset')}>Reset</button></div>`;
}
function demoPanel(){
  return `<h1>Pulse</h1><p class="tag">Diabetes care that feels like home. A playable front-end prototype.</p>
  <h3>Walk the prototype journey</h3>${demoContent()}
  <h3>How Pulse plays</h3><ul class="note"><li><b>Kolam:</b> five daily petals around the family photo. A missed day is a rest day, never a broken streak.</li><li><b>Family Banyan:</b> hearts grow it across the 90 days.</li><li><b>Variable rewards:</b> a random family voice after every tablet, scratch cards, Dish Dex reveals.</li><li><b>Co-op, not rivalry:</b> the Family Quest is won together.</li><li><b>Calm where it counts:</b> Safety Net and Mood check have no games at all.</li></ul>`;
}
SHEETS.demo=()=>`<div class="stack"><div class="h2">Demo director</div><p class="muted">Jump to any moment of the Phase 1 prototype journey.</p>${demoContent()}</div>`;
Object.assign(ACT,{
 demo(i){S.sheet=null;S.voice=null;$('#push').innerHTML='';DEMO[+i][1]();render();const sc=document.querySelector('.scroll');if(sc)sc.scrollTop=0},
 demoMode(m){S.role='patient';S.mode=m;S.tab='home';S.stack=[];S.sheet=null;render()},
 demoDay(d){S.day=+d;S.hearts={1:20,23:340,60:900,90:1580}[d];S.saved={1:0,23:1180,60:1900,90:2638}[d];S.tabletDays={1:1,23:64,60:92,90:100}[d];S.challenge={1:0,23:4,60:5,90:5}[d];S.sheet=null;render();toast('Jumped to Day '+d,'calendar')},
 demoComplete(){QUESTS.forEach(q=>S.quests[q.id]=true);S.tab='home';S.stack=[];S.role='patient';render();setTimeout(()=>{confetti(60);chime('win');sheet('daydone')},300)},
 demoReset(){resetState();$('#push').innerHTML='';render();toast('Prototype reset','rotate')},
});
ACT.openDemo=()=>sheet('demo');

/* ---------- Boot ---------- */
render();

</script>
